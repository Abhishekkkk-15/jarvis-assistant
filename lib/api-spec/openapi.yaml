openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: JARVIS AI Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chat completions
  - name: transcribe
    description: Speech-to-text transcription
  - name: settings
    description: User settings and API key management
  - name: conversations
    description: Conversation history management
  - name: commands
    description: System command execution
  - name: cron
    description: Background scheduled task management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat:
    post:
      operationId: sendChat
      tags: [chat]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [transcribe]
      summary: Transcribe audio to text via Groq Whisper (base64 encoded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioInput"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tts:
    post:
      operationId: synthesizeSpeech
      tags: [tts]
      summary: Synthesize speech via Groq TTS (Orpheus). Returns audio/wav binary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TTSInput"
      responses:
        "200":
          description: Audio data as WAV
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: TTS error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /settings:

    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user settings (API keys masked)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation with its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /commands/execute:
    post:
      operationId: executeCommand
      tags: [commands]
      summary: Execute a parsed voice command on the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: Command execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"

  /commands/suggestions:
    get:
      operationId: getCommandSuggestions
      tags: [commands]
      summary: Get available command categories and examples
      responses:
        "200":
          description: Command suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandCategory"

  /stats:
    get:
      operationId: getStats
      tags: [chat]
      summary: Get usage statistics for the dashboard
      responses:
        "200":
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /chat/stop:
    post:
      operationId: stopChat
      tags: [chat]
      summary: Abort an ongoing chat execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopChatInput"
      responses:
        "200":
          description: Execution stopped successfully

  /cron:
    get:
      operationId: listScheduledTasks
      tags: [cron]
      summary: List all scheduled tasks (including agent-created ones)
      responses:
        "200":
          description: List of scheduled tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledTask"
    post:
      operationId: createScheduledTask
      tags: [cron]
      summary: Create and schedule a new background task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTask"

  /cron/{id}:
    delete:
      operationId: deleteScheduledTask
      tags: [cron]
      summary: Delete and cancel a scheduled task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted and stopped successfully

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AudioInput:
      type: object
      required: [audioBase64, mimeType]
      properties:
        audioBase64:
          type: string
          description: Base64-encoded audio data
        mimeType:
          type: string
          description: "audio/webm, audio/wav, audio/mp4, etc."

    TTSInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The text to synthesize into speech
        voice:
          type: string
          description: "Voice ID (e.g. autumn, diana, austin, etc.)"
          default: "autumn"
        model:
          type: string
          description: "TTS model to use"
          default: "canopylabs/orpheus-v1-english"

    ChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        conversationId:
          type: ["integer", "null"]
        model:
          type: ["string", "null"]
        provider:
          type: ["string", "null"]
          description: "groq | nvidia"
        imageBase64:
          type: ["string", "null"]
          description: "Optional base64 image data for multimodal vision models"

    ChatResponse:
      type: object
      required: [reply, conversationId, messageId]
      properties:
        reply:
          type: string
        conversationId:
          type: integer
        messageId:
          type: integer
        model:
          type: ["string", "null"]
        tokensUsed:
          type: ["integer", "null"]
        toolsUsed:
          type: ["array", "null"]
          items:
            type: string

    TranscribeResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
        confidence:
          type: ["number", "null"]

    Settings:
      type: object
      required: [id, selectedModel, selectedProvider, visionModel, visionProvider, wakeWord, voiceEnabled, selectedCharacterId, miniModeEnabled]
      properties:
        id:
          type: integer
        groqApiKeySet:
          type: boolean
        nvidiaApiKeySet:
          type: boolean
        openaiApiKeySet:
          type: boolean
        anthropicApiKeySet:
          type: boolean
        mistralApiKeySet:
          type: boolean
        openrouterApiKeySet:
          type: boolean
        geminiApiKeySet:
          type: boolean
        customTextApiUrl:
          type: ["string", "null"]
        customTextApiKeySet:
          type: boolean
        customVisionApiUrl:
          type: ["string", "null"]
        customVisionApiKeySet:
          type: boolean
        selectedModel:
          type: string
        selectedProvider:
          type: string
        visionModel:
          type: string
        visionProvider:
          type: string
        wakeWord:
          type: string
        voiceEnabled:
          type: boolean
        selectedCharacterId:
          type: string
        miniModeEnabled:
          type: boolean
        telegramBotToken:
          type: ["string", "null"]
        discordBotToken:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        notionApiKey:
          type: ["string", "null"]
        spotifyClientId:
          type: ["string", "null"]
        spotifyClientSecret:
          type: ["string", "null"]
        emailAddress:
          type: ["string", "null"]
        emailPassword:
          type: ["string", "null"]
        emailPasswordSet:
          type: boolean
        emailProvider:
          type: ["string", "null"]
        githubPatSet:
          type: boolean
        googleClientIdSet:
          type: boolean
        googleClientSecretSet:
          type: boolean
        googleRefreshTokenSet:
          type: boolean

    SettingsInput:
      type: object
      properties:
        groqApiKey:
          type: ["string", "null"]
        nvidiaApiKey:
          type: ["string", "null"]
        openaiApiKey:
          type: ["string", "null"]
        anthropicApiKey:
          type: ["string", "null"]
        mistralApiKey:
          type: ["string", "null"]
        openrouterApiKey:
          type: ["string", "null"]
        geminiApiKey:
          type: ["string", "null"]
        githubPat:
          type: ["string", "null"]
        customTextApiUrl:
          type: ["string", "null"]
        customTextApiKey:
          type: ["string", "null"]
        customVisionApiUrl:
          type: ["string", "null"]
        customVisionApiKey:
          type: ["string", "null"]
        selectedModel:
          type: ["string", "null"]
        selectedProvider:
          type: ["string", "null"]
        visionModel:
          type: ["string", "null"]
        visionProvider:
          type: ["string", "null"]
        wakeWord:
          type: ["string", "null"]
        voiceEnabled:
          type: ["boolean", "null"]
        selectedCharacterId:
          type: ["string", "null"]
        miniModeEnabled:
          type: ["boolean", "null"]
        telegramBotToken:
          type: ["string", "null"]
        discordBotToken:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        notionApiKey:
          type: ["string", "null"]
        spotifyClientId:
          type: ["string", "null"]
        spotifyClientSecret:
          type: ["string", "null"]
        emailAddress:
          type: ["string", "null"]
        emailPassword:
          type: ["string", "null"]
        emailProvider:
          type: ["string", "null"]
        googleClientId:
          type: ["string", "null"]
        googleClientSecret:
          type: ["string", "null"]
        googleRefreshToken:
          type: ["string", "null"]

    Message:
      type: object
      required: [id, role, content, createdAt, conversationId]
      properties:
        id:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        conversationId:
          type: integer
        model:
          type: ["string", "null"]

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    ConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string

    ConversationDetail:
      type: object
      required: [id, title, createdAt, updatedAt, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    CommandInput:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          description: "open_app | search_web | set_reminder | get_time | get_weather | clipboard | screenshot | custom"
        payload:
          type: object
          additionalProperties: true

    CommandResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: ["object", "null"]
          additionalProperties: true

    CommandCategory:
      type: object
      required: [name, description, examples]
      properties:
        name:
          type: string
        description:
          type: string
        examples:
          type: array
          items:
            type: string

    Stats:
      type: object
      required: [totalConversations, totalMessages, todayMessages, topCommands]
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        todayMessages:
          type: integer
        topCommands:
          type: array
          items:
            type: object
            required: [command, count]
            properties:
              command:
                type: string
              count:
                type: integer

    StopChatInput:
      type: object
      required: [conversationId]
      properties:
        conversationId:
          type: integer
          description: The ID of the conversation to stop.

    ScheduledTask:
      type: object
      required: [id, cronExpression, taskDescription, createdAt]
      properties:
        id:
          type: integer
        cronExpression:
          type: string
        taskDescription:
          type: string
        createdAt:
          type: string
          format: date-time

    ScheduledTaskInput:
      type: object
      required: [cronExpression, taskDescription]
      properties:
        cronExpression:
          type: string
        taskDescription:
          type: string

